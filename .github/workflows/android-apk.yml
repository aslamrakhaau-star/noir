name: Build NOIR Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'dist/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout NOIR source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle NOIR web assets
        run: |
          set -eux
          mkdir -p android/app/src/main/assets
          cp -R dist/. android/app/src/main/assets/
          test -s android/app/src/main/assets/index.html
          find android/app/src/main/assets -maxdepth 2 -type f | head -30
      - name: Check Android and Gradle versions
        run: |
          set -eux
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lah "$ANDROID_HOME/platforms" || true
      - name: Build installable debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee android-build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-Cinema-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload build diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOIR-build-error-log
          path: android-build.log
          if-no-files-found: ignore
